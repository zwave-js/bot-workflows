name: Setup bot
description: >-
  Installs the shared bot-script dependencies and restores the local
  embedding model, for jobs that run scripts from this repository.

# This action is the single owner of the model cache location and key -
# the JS side reads the location from BOT_MODEL_CACHE_DIR set below, and
# the key is derived from the model pin in localEmbeddings.cjs, so an
# unrelated edit to that file does not evict the weights.
#
# The action runs from the shared-repo tarball GitHub places under
# _actions, so bot-scripts/ ships alongside it and is located via
# GITHUB_ACTION_PATH rather than the consumer's workspace. The scripts are
# then copied to a fixed directory under $HOME and BOT_SCRIPTS_DIR points
# there, so later steps and sibling actions find them without repeating that
# resolution.

inputs:
  save-caches:
    description: >-
      Save the dependency and model caches after a miss. Only the nightly
      index builders should do this - user-triggered jobs restore only, so a
      job that is cut short cannot persist a partial download under an
      immutable key, and event contexts whose runtime token has no cache
      write scope (discussion-triggered agentic runs) do not warn in their
      post step.
    required: false
    default: 'false'

runs:
  using: composite

  steps:
    # No npm download cache here: hashFiles() and setup-node's
    # cache-dependency-path only see the workspace, and the lockfile lives
    # in the action tarball. The node_modules cache below covers installs.
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 22

    - name: Locate bot scripts
      id: locate
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        src=$(cd "$ACTION_PATH/../../bot-scripts" && pwd)
        # Run from a fixed directory instead of the action tarball, because
        # actions/cache folds the cached path into the entry version: the
        # tarball path carries the ref the caller pinned, so caching in place
        # gives the SHA gh-aw pins and the floating v1 the reusable workflows
        # use separate entries that never see each other's writes
        dir="$HOME/.cache/zwave-js-bot/bot-scripts"
        # Start from an empty directory so a self-hosted runner cannot mix in
        # scripts a release since renamed or dropped; the cache restore below
        # brings node_modules back
        rm -rf "$dir"
        mkdir -p "$dir"
        cp -R "$src/." "$dir/"
        echo "BOT_SCRIPTS_DIR=$dir" >> "$GITHUB_ENV"
        echo "dir=$dir" >> "$GITHUB_OUTPUT"
        # hashFiles() cannot reach outside the workspace, so hash the
        # lockfile by hand for the node_modules cache key
        echo "lockhash=$(sha256sum "$dir/package-lock.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

    # Cache node_modules itself: the ~350 MB onnxruntime extraction
    # dominates npm ci
    - name: Restore dependencies
      id: modules-restore
      if: inputs.save-caches != 'true'
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/zwave-js-bot/bot-scripts/node_modules
        key: bot-scripts-modules-${{ runner.os }}-${{ steps.locate.outputs.lockhash }}

    - name: Restore and save dependencies
      id: modules
      if: inputs.save-caches == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.cache/zwave-js-bot/bot-scripts/node_modules
        key: bot-scripts-modules-${{ runner.os }}-${{ steps.locate.outputs.lockhash }}

    - name: Install dependencies
      if: |
        steps.modules-restore.outputs.cache-hit != 'true' &&
        steps.modules.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ steps.locate.outputs.dir }}
      # --ignore-scripts skips onnxruntime-node's postinstall, which would
      # download additional (GPU) execution providers - the CPU runtime
      # ships inside the package itself
      run: npm ci --ignore-scripts

    - name: Resolve the model cache key
      id: model
      shell: bash
      env:
        SCRIPTS_DIR: ${{ steps.locate.outputs.dir }}
      run: |
        set -euo pipefail
        key=$(node --print "require('$SCRIPTS_DIR/indexes/localEmbeddings.cjs').MODEL_CACHE_KEY")
        echo "key=embedding-model-$key" >> "$GITHUB_OUTPUT"
        echo "BOT_MODEL_CACHE_DIR=$HOME/.cache/zwave-js-bot/models" >> "$GITHUB_ENV"

    # The restore-keys prefix seeds the cache dir from an older entry on
    # a near-miss; transformers.js re-downloads only what is missing
    - name: Restore embedding model
      if: inputs.save-caches != 'true'
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/zwave-js-bot/models
        key: ${{ steps.model.outputs.key }}
        restore-keys: embedding-model-

    - name: Restore and save embedding model
      if: inputs.save-caches == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.cache/zwave-js-bot/models
        key: ${{ steps.model.outputs.key }}
        restore-keys: embedding-model-
