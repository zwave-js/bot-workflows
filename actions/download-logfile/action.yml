name: 'Download logfile'
description: 'Downloads a Z-Wave JS logfile for the analysis agent, unpacking compressed uploads'

# The decompress script relies only on Node builtins, so no dependency install
# (setup-bot) is needed - the action just points BOT_SCRIPTS_DIR at the
# bot-scripts/ directory that ships in the same repository tarball.

inputs:
  url:
    description: 'URL of the logfile to download'
    required: true
  path:
    description: 'Where to place the downloaded logfile'
    required: false
    default: /tmp/gh-aw/agent/logfile.log

runs:
  using: 'composite'
  steps:
    # Export instead of a local variable: a preceding setup-bot (if any) sets
    # the same value
    - name: Locate bot scripts
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        if [ -z "${BOT_SCRIPTS_DIR:-}" ]; then
          echo "BOT_SCRIPTS_DIR=$(cd "$ACTION_PATH/../../bot-scripts" && pwd)" >> "$GITHUB_ENV"
        fi

    - name: Download and unpack logfile
      shell: bash
      env:
        LOGFILE_URL: ${{ inputs.url }}
        LOGFILE_PATH: ${{ inputs.path }}
      run: |
        mkdir -p "$(dirname "$LOGFILE_PATH")"
        # 2 GB is the cap for plaintext logs; the decompress step rejects
        # compressed uploads over 250 MB
        curl -fsSL --max-filesize 2147483648 --connect-timeout 15 --max-time 600 --retry 3 --retry-delay 2 -o "$LOGFILE_PATH" "$LOGFILE_URL"
        node "$BOT_SCRIPTS_DIR/logfile/decompressLogfile.cjs"
        wc -l "$LOGFILE_PATH"
