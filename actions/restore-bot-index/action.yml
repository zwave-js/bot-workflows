name: Restore bot index
description: >-
  Restore the docs or posts embeddings index from the Actions cache, falling
  back to the artifact uploaded by the workflow that builds it.

# The Actions cache is capped per repository and evicted least-recently-used, so
# a 1-2 MB index regularly disappears within hours of being written. Artifacts
# are not evicted, so they are what makes the restore dependable.
#
# Each index lives in a fixed directory (.docs-index / .posts-index) holding a
# single index.json, and is published under a fixed artifact name, so the caller
# only has to say which one it wants.
#
# The scripts used here rely only on Node builtins, so no dependency install
# (setup-bot) is needed - the action just points BOT_SCRIPTS_DIR at the
# bot-scripts/ directory that ships in the same repository tarball.

inputs:
  index:
    description: Which index to restore - "docs" or "posts"
    required: true
  github-token:
    description: Token with actions read scope, used to find and download the artifact
    required: true
  producer-workflow:
    description: >-
      Filename of the workflow whose runs publish the index artifact. With the
      embeddings builders being reusable workflows, runs are attributed to the
      CALLER's workflow file in the consumer repo - set this to that filename.
      The default matches callers named docs-embeddings.yml / posts-embeddings.yml.
    required: false
    default: ''
  max-age-days:
    description: >-
      Report the index as stale once the newest artifact is at least this many
      days old. Both producers run on a daily cron (docs-embeddings 03:30,
      posts-embeddings 04:30), so the default tolerates two missed nights -
      raise it here if either cron is ever moved to a slower cadence.
    required: false
    default: '3'

outputs:
  found:
    description: '"true" when the index is available afterwards'
    value: ${{ steps.report.outputs.found }}
  age-days:
    description: 'Age of the newest artifact in whole days, or "" if unknown'
    value: ${{ steps.report.outputs.age-days }}
  status:
    description: >-
      '"fresh", "stale" (the API confirmed no recent publication) or "unknown"
      (the artifacts API could not be queried), for accurate alarm wording.
      Anything other than "fresh" means the pipeline that publishes the index
      looks dead - health checks should treat that as a failure; callers
      serving a user should keep going.'
    value: ${{ steps.report.outputs.status }}
  prefix:
    description: >-
      The version-derived cache key prefix for this index, for callers that
      save an updated index back to the cache.
    value: ${{ steps.cfg.outputs.prefix }}
  source:
    description: 'Where the index was restored from - "cache", "artifact" or "none"'
    value: ${{ steps.report.outputs.source }}

runs:
  using: composite

  steps:
    # Export instead of a local variable: github-script steps below read it
    # from process.env, and a preceding setup-bot (if any) sets the same value
    - name: Locate bot scripts
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        if [ -z "${BOT_SCRIPTS_DIR:-}" ]; then
          echo "BOT_SCRIPTS_DIR=$(cd "$ACTION_PATH/../../bot-scripts" && pwd)" >> "$GITHUB_ENV"
        fi

    - name: Resolve the index
      id: cfg
      shell: bash
      env:
        INDEX: ${{ inputs.index }}
        PRODUCER_WORKFLOW: ${{ inputs.producer-workflow }}
      run: |
        set -euo pipefail
        case "$INDEX" in
          docs)  prefixName=DOCS_CACHE_PREFIX ;;
          posts) prefixName=POSTS_CACHE_PREFIX ;;
          *) echo "::error::Unknown index '$INDEX' - expected 'docs' or 'posts'"; exit 1 ;;
        esac
        # The cache prefix and index version live together in one module, so a
        # version bump namespaces the cache afresh without editing this file
        prefix=$(node -p "require('$BOT_SCRIPTS_DIR/indexes/indexCacheKeys.cjs').$prefixName")
        echo "path=.$INDEX-index" >> "$GITHUB_OUTPUT"
        echo "artifact=$INDEX-index" >> "$GITHUB_OUTPUT"
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        echo "workflow=${PRODUCER_WORKFLOW:-$INDEX-embeddings.yml}" >> "$GITHUB_OUTPUT"

    # A prefix restore picks the newest entry; the file is validated below, so
    # an entry saved mid-write is caught rather than the key having to be exact
    - name: Restore the index from cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.cfg.outputs.path }}
        key: ${{ steps.cfg.outputs.prefix }}
        restore-keys: ${{ steps.cfg.outputs.prefix }}

    # Decide on the file, not on the cache key: a prefix match can restore an
    # entry that was saved while its build was still writing it
    - name: Check what the cache gave us
      id: cached
      uses: actions/github-script@v9
      env:
        INDEX_FILE: ${{ steps.cfg.outputs.path }}/index.json
      with:
        script: |
          const bot = require(`${process.env.BOT_SCRIPTS_DIR}/indexes/restoreBotIndex.cjs`);
          bot.checkCachedIndex({ core });

    # Runs even on a cache hit: its upload time is also the only honest "is the
    # nightly still running" signal, and selecting on the artifact rather than a
    # run's conclusion keeps an unrelated evaluate/feedback failure from hiding a
    # perfectly good artifact.
    - name: Find the newest usable index artifact
      id: artifact
      continue-on-error: true
      uses: actions/github-script@v9
      env:
        ARTIFACT: ${{ steps.cfg.outputs.artifact }}
        PRODUCER_WORKFLOW: ${{ steps.cfg.outputs.workflow }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const bot = require(`${process.env.BOT_SCRIPTS_DIR}/indexes/restoreBotIndex.cjs`);
          await bot.findIndexArtifact({ github, context, core });

    # A partial cache restore must not be mixed with the artifact contents
    - name: Clear the target directory
      if: steps.cached.outputs.ok != 'true' && steps.artifact.outputs.id != ''
      shell: bash
      env:
        DIR: ${{ steps.cfg.outputs.path }}
      run: rm -rf "$DIR"

    - name: Download the index artifact
      id: download
      if: steps.cached.outputs.ok != 'true' && steps.artifact.outputs.id != ''
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ steps.cfg.outputs.artifact }}
        path: ${{ steps.cfg.outputs.path }}
        run-id: ${{ steps.artifact.outputs.id }}
        github-token: ${{ inputs.github-token }}

    - name: Report what was restored
      id: report
      uses: actions/github-script@v9
      env:
        INDEX_FILE: ${{ steps.cfg.outputs.path }}/index.json
        ARTIFACT: ${{ steps.cfg.outputs.artifact }}
        FROM_CACHE: ${{ steps.cached.outputs.ok }}
        ARTIFACT_RUN: ${{ steps.artifact.outputs.id }}
        ARTIFACT_CREATED: ${{ steps.artifact.outputs.created }}
        SEARCHED: ${{ steps.artifact.outputs.searched }}
        LOOKUP: ${{ steps.artifact.outcome }}
        DOWNLOAD: ${{ steps.download.outcome }}
        MAX_AGE_DAYS: ${{ inputs.max-age-days }}
      with:
        script: |
          const bot = require(`${process.env.BOT_SCRIPTS_DIR}/indexes/restoreBotIndex.cjs`);
          bot.reportRestore({ core });
