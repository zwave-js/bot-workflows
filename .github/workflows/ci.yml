name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: bot-scripts/package-lock.json

    - name: Install dependencies
      working-directory: bot-scripts
      # --ignore-scripts skips onnxruntime-node's postinstall, which would
      # download additional (GPU) execution providers
      run: npm ci --ignore-scripts

    - name: Provide a bot config for the tests
      # config.cjs loads $GITHUB_WORKSPACE/.github/zwave-js-bot.config.json at
      # require time; in a consumer that is the caller's checkout, here the
      # example config stands in
      run: cp config.example.json .github/zwave-js-bot.config.json

    - name: Run tests
      working-directory: bot-scripts
      # vitest is fetched by npx: it is a CI-only tool, and keeping it out
      # of package.json keeps the runtime install the bot jobs pay for lean
      run: npx --yes vitest run

  compile-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install gh-aw
      env:
        GH_TOKEN: ${{ github.token }}
      # Pin to the version the locks were generated with. Upgrading it
      # regenerates all locks, which then land in the same PR.
      run: gh extension install github/gh-aw --pin v0.81.6

    - name: Recompile workflows
      env:
        GH_TOKEN: ${{ github.token }}
      # The shared imports are absolute (zwave-js/bot-workflows/...@main),
      # so compilation resolves them against this repo's pushed main branch
      run: gh aw compile workflows/*.md

    - name: Fail on drift
      # git add -N stages untracked lock files so missing locks count as drift
      run: |
        git add -N workflows
        if ! git diff --exit-code; then
          echo "::error::Compiled gh-aw workflows are out of date - run 'gh aw compile workflows/*.md' and commit the result"
          exit 1
        fi

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Run actionlint
      run: |
        set -euo pipefail
        bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
        ./actionlint -color
