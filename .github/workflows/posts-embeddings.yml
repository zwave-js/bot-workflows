name: Build posts embeddings index

# Builds and caches a semantic search index over the consumer repo's issues
# and discussions, used by the bot to suggest related/duplicate posts.
# Between the nightly rebuilds, new posts are appended incrementally by
# the update-posts-index job in the issue/discussion bot workflow.
#
# Reusable: the consumer owns the triggers (nightly cron plus a push
# filter on its pin of this repo) and calls this workflow.

on:
  workflow_call:

permissions:
  contents: read
  issues: read
  discussions: read

jobs:
  build-index:
    runs-on: [ubuntu-latest]
    timeout-minutes: 20
    outputs:
      cache-key: ${{ steps.cachekey.outputs.key }}

    steps:
    - name: Checkout consumer repo
      uses: actions/checkout@v7

    # Runs before the cache key is computed because indexCacheKeys.cjs only
    # exists once the action tarball is on disk
    - name: Setup bot
      uses: zwave-js/bot-workflows/actions/setup-bot@v1
      with:
        save-model-cache: 'true'

    # The version-derived prefix lives in indexCacheKeys.cjs; the run-scoped
    # save key is computed once here and reused by the evaluate job
    - name: Compute the cache key
      id: cachekey
      run: |
        set -euo pipefail
        prefix=$(node -p "require('$BOT_SCRIPTS_DIR/indexes/indexCacheKeys.cjs').POSTS_CACHE_PREFIX")
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        echo "key=${prefix}${{ github.run_id }}" >> "$GITHUB_OUTPUT"

    # Cache keys are immutable, so the rolling index is always saved under
    # a fresh run-scoped key and restored via the newest prefix match.
    # The explicit restore/save split ensures a failed build does not
    # re-save a stale index under a new key.
    - name: Restore previous index
      uses: actions/cache/restore@v6
      with:
        path: .posts-index
        # There is no exact key to match, the newest index is picked
        # via the prefix
        key: ${{ steps.cachekey.outputs.prefix }}
        restore-keys: |
          ${{ steps.cachekey.outputs.prefix }}

    - name: Build index
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: node "$BOT_SCRIPTS_DIR/indexes/buildPostsIndex.cjs" ${{ github.repository }} .posts-index/index.json

    - name: Save index
      uses: actions/cache/save@v6
      with:
        path: .posts-index
        key: ${{ steps.cachekey.outputs.key }}

    # Use artifacts as a fallback for the actions cache getting evicted
    - name: Upload index artifact
      uses: actions/upload-artifact@v7
      with:
        name: posts-index
        path: .posts-index
        retention-days: 30
        # Include dot directories, including `.posts-index`
        include-hidden-files: true
        # The answer bot depends on this artifact existing
        if-no-files-found: error

  evaluate:
    needs: build-index
    runs-on: [ubuntu-latest]
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write

    steps:
    - name: Checkout consumer repo
      uses: actions/checkout@v7

    - name: Restore posts index
      id: restore-index
      uses: actions/cache/restore@v6
      with:
        path: .posts-index
        key: ${{ needs.build-index.outputs.cache-key }}

    - name: Fail if posts index is missing
      if: steps.restore-index.outputs.cache-hit != 'true'
      run: |
        echo "::error::Posts index cache miss after build-index - cannot evaluate retrieval quality"
        exit 1

    - name: Setup bot
      uses: zwave-js/bot-workflows/actions/setup-bot@v1

    - name: Evaluate retrieval quality
      id: eval
      continue-on-error: true
      run: node "$BOT_SCRIPTS_DIR/eval/evalRelatedPosts.cjs" .posts-index/index.json

    - name: Update tracking issue
      uses: actions/github-script@v9
      env:
        TRACKING_ISSUE_TITLE: "🚨 Related posts bot retrieval quality regression"
        EVAL_NAME: related posts bot
        EVAL_OUTCOME: ${{ steps.eval.outcome }}
        EVAL_SUMMARY: ${{ steps.eval.outputs.summary }}
      with:
        script: |
          const updateEvalTrackingIssue = require(`${process.env.BOT_SCRIPTS_DIR}/eval/updateEvalTrackingIssue.cjs`);
          await updateEvalTrackingIssue({github, context});
