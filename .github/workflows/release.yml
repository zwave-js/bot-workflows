name: Release

# Tagging vX.Y.Z publishes a GitHub release and force-moves the floating
# major tag (e.g. v1) that consumers pin their `uses:` references to.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        flags=()
        # A pre-release identifier (v1.0.0-rc.1) must not become the "latest" release
        [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
        gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes "${flags[@]}"

    - name: Move the floating major tag
      run: |
        set -euo pipefail
        major=${GITHUB_REF_NAME%%.*}
        # Point the major tag at the commit: for an annotated tag, git ls-remote
        # returns the hash of the tag object, and the consumer repin scripts
        # cannot use that as an action ref
        git tag -f "$major" "$GITHUB_REF_NAME^{commit}"
        git push -f origin "$major"
